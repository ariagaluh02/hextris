apiVersion: apps/v1
kind: Deployment
metadata:
  name: hextris-app-aria
  labels:
    app: hextris-app-aria
  namespace: exam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hextris-app-aria
  template:
    metadata:
      labels:
        app: hextris-app-aria
    spec:
      containers:
      - name: ct-app
        image: ariagaluh02/web-hextris-image:latest
        ports:
        - containerPort: 3000
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: hextris-app-aria
  labels:
    app: hextris-app-aria
  namespace: exam
spec:
  type: ClusterIP
  selector:
    app: hextris-app-aria
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: hextris-app-aria
  namespace: exam
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - 'hextris-aria.appsku.local'
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: hextris-app-aria
  namespace: exam
spec:
  hosts:
    - "hextris-aria.appsku.local"
  gateways:
    - hextris-app-aria
  http:
    - route:
        - destination:
            host: hextris-app-aria
            port:
              number: 80